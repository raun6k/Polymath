name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── C++ Chunker Build & Tests ──────────────────────────────────────────────
  cpp-tests:
    name: C++ Build & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pybind11
        run: pip install pybind11

      - name: Configure CMake
        run: |
          cmake -S chunker -B chunker/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON

      - name: Build (extension + tests)
        run: cmake --build chunker/build --parallel $(nproc)

      - name: Run C++ tests
        run: ctest --test-dir chunker/build --output-on-failure

      - name: Install pybind11 extension
        run: cmake --install chunker/build --prefix .

  # ── Python Tests ────────────────────────────────────────────────────────────
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: cpp-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install pybind11 and build C++ extension
        run: |
          pip install pybind11
          cmake -S chunker -B chunker/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build chunker/build --parallel $(nproc)
          cmake --install chunker/build --prefix .

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ── MCP Server TypeScript Build ─────────────────────────────────────────────
  ts-build:
    name: TypeScript Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp-server/package.json

      - name: Install npm dependencies
        working-directory: mcp-server
        run: npm install

      - name: TypeScript compile
        working-directory: mcp-server
        run: npm run build
